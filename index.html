<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An academic homepage for research, publications, and recent updates.">
  <title>Academic Homepage</title>
  <link rel="stylesheet" href="style.css">
  <script src="profile.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main" data-label="skip">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="site-name" href="#home" data-name>Your Name</a>
      <nav class="site-nav" aria-label="Main navigation" data-aria="navigation">
        <a href="#home" data-label="home" aria-current="page">Home</a>
        <a href="#publications" data-label="publications">Publications</a>
        <a href="#research" data-label="research">Research</a>
      </nav>
      <button type="button" id="language-switch" lang="zh-CN">中文</button>
    </div>
  </header>

  <div class="layout">
    <aside class="profile" aria-label="Profile" data-aria="profile">
      <div class="avatar">
        <img id="photo" width="136" height="136" alt="" hidden>
      </div>
      <div class="profile-details">
        <p class="profile-name" data-name>Your Name</p>
        <p class="affiliation"><span id="position"></span><span id="institution"></span></p>
        <div class="profile-links" id="profile-links"></div>
      </div>
    </aside>

    <main id="main" tabindex="-1">
      <article id="home" data-page aria-labelledby="name-heading">
        <h1 id="name-heading" data-name>Your Name</h1>
        <div class="biography" id="biography"></div>
        <section id="news" aria-labelledby="news-heading">
          <h2 id="news-heading"><span data-label="news">News</span> <small data-sample data-label="sample">(Examples)</small></h2>
          <ul id="news-list"></ul>
        </section>
      </article>

      <article id="publications" data-page aria-labelledby="publications-heading" hidden>
        <h1 id="publications-heading"><span data-label="publications">Publications</span> <small data-sample data-label="sample">(Examples)</small></h1>
        <ul class="publication-list" id="publication-list"></ul>
      </article>

      <article id="research" data-page aria-labelledby="research-heading" hidden>
        <h1 id="research-heading"><span data-label="research">Research</span> <small data-sample data-label="sample">(Examples)</small></h1>
        <ul class="research-list" id="research-list"></ul>
      </article>

      <noscript><p>Enable JavaScript to display this profile. 请启用 JavaScript 以显示个人资料。</p></noscript>
    </main>
  </div>
</body>
</html>
