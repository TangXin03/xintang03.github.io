<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="唐鑫，山西大学计算机技术专业硕士研究生。研究方向包括进化计算、多模态机器学习和信号处理。">
  <title>唐鑫 · 学术个人主页</title>
  <link rel="stylesheet" href="style.css">
  <script src="profile.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main" data-label="skip">跳到正文</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="site-name" href="#home" data-name>唐鑫</a>
      <nav class="site-nav" aria-label="主导航" data-aria="navigation">
        <a href="#home" data-label="home" aria-current="page">首页</a>
        <a href="#publications" data-label="publications">论文</a>
        <a href="#research" data-label="research">研究</a>
      </nav>
      <button type="button" id="language-switch" lang="en">English</button>
    </div>
  </header>

  <div class="layout">
    <aside class="profile" aria-label="个人资料" data-aria="profile">
      <div class="avatar">
        <img id="photo" width="136" height="136" alt="" hidden>
      </div>
      <div class="profile-details">
        <p class="profile-name" data-name>唐鑫</p>
        <p class="affiliation"><span id="position"></span><span id="institution"></span></p>
        <div class="profile-links" id="profile-links"></div>
      </div>
    </aside>

    <main id="main" tabindex="-1">
      <article id="home" data-page aria-labelledby="name-heading">
        <h1 id="name-heading" data-name>唐鑫</h1>
        <div class="biography" id="biography"></div>
        <section id="education" aria-labelledby="education-heading" hidden>
          <h2 id="education-heading" data-label="education">教育经历</h2>
          <ul id="education-list"></ul>
        </section>
        <section id="news" aria-labelledby="news-heading">
          <h2 id="news-heading"><span data-label="news">News</span> <small data-sample data-label="sample">(Examples)</small></h2>
          <ul id="news-list"></ul>
        </section>
      </article>

      <article id="publications" data-page aria-labelledby="publications-heading" hidden>
        <h1 id="publications-heading"><span data-label="publications">Publications</span> <small data-sample data-label="sample">(Examples)</small></h1>
        <ul class="publication-list" id="publication-list"></ul>
        <p id="publication-status" hidden></p>
      </article>

      <article id="research" data-page aria-labelledby="research-heading" hidden>
        <h1 id="research-heading"><span data-label="research">Research</span> <small data-sample data-label="sample">(Examples)</small></h1>
        <ul class="research-list" id="research-list"></ul>
      </article>

      <noscript><p>Enable JavaScript to display this profile. 请启用 JavaScript 以显示个人资料。</p></noscript>
    </main>
  </div>
</body>
</html>
